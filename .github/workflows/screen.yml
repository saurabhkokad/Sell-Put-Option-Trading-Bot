name: Daily Put Screener

on:
  schedule:
    # 15:30 UTC -- always at least 60 min after the 9:30am ET market open,
    # in both DST states (GitHub Actions cron is fixed UTC, no DST awareness):
    #   EST (Nov-Mar): 10:30am ET = exactly 60 min after open
    #   EDT (Mar-Nov): 11:30am ET = 120 min after open (extra buffer, never less)
    # Running before open risks stale/empty option quotes; running right at
    # open risks wide opening-auction spreads. Runs Mon-Fri only.
    - cron: "30 15 * * 1-5"
  workflow_dispatch: {}  # allows manually triggering a run from the Actions tab

permissions:
  contents: write # needed to commit the day's picks JSON back to the repo

jobs:
  screen:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run screener
        env:
          ALPACA_API_KEY_ID: ${{ secrets.ALPACA_API_KEY_ID }}
          ALPACA_API_SECRET_KEY: ${{ secrets.ALPACA_API_SECRET_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python main.py

      - name: Commit and push today's picks
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add picks/
          git diff --staged --quiet || git commit -m "Update daily picks $(date -u +%Y-%m-%d)"
          git push
