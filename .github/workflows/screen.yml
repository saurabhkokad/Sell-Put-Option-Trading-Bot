name: Daily Put Screener

on:
  schedule:
    # Primary: 15:37 UTC -- at least 60 min after the 9:30am ET market open,
    # in both DST states (GitHub Actions cron is fixed UTC, no DST awareness):
    #   EST (Nov-Mar): 10:37am ET = ~67 min after open
    #   EDT (Mar-Nov): 11:37am ET = ~127 min after open (extra buffer, never less)
    # Running before open risks stale/empty option quotes; running right at
    # open risks wide opening-auction spreads.
    #
    # Off-minute (":37" not ":30"/":00") deliberately avoids GitHub Actions'
    # documented congestion points (top of hour, :00/:15/:30/:45), where
    # scheduled runs can be delayed or silently skipped entirely under load.
    #
    # Backup: 17:42 UTC, ~2 hours later, in case the primary got skipped --
    # the job checks for today's picks file first and no-ops if it already
    # ran, so this doesn't duplicate a successful primary run.
    #
    # Both run Mon-Fri only.
    - cron: "37 15 * * 1-5"
    - cron: "42 17 * * 1-5"
  workflow_dispatch: {}  # allows manually triggering a run from the Actions tab

permissions:
  contents: write # needed to commit the day's picks JSON back to the repo

jobs:
  screen:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Check if today's picks already exist
        id: check
        run: |
          if [ -f "picks/$(date -u +%Y-%m-%d).json" ]; then
            echo "Today's picks already exist -- primary run must have succeeded, skipping."
            echo "already_ran=true" >> "$GITHUB_OUTPUT"
          else
            echo "already_ran=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v7
        if: steps.check.outputs.already_ran == 'false'
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        if: steps.check.outputs.already_ran == 'false'
        run: pip install -r requirements.txt

      - name: Run screener
        if: steps.check.outputs.already_ran == 'false'
        env:
          ALPACA_API_KEY_ID: ${{ secrets.ALPACA_API_KEY_ID }}
          ALPACA_API_SECRET_KEY: ${{ secrets.ALPACA_API_SECRET_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python main.py

      - name: Commit and push today's picks
        if: steps.check.outputs.already_ran == 'false'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add picks/
          git diff --staged --quiet || git commit -m "Update daily picks $(date -u +%Y-%m-%d)"
          git push
